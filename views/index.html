<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
:root {
  --bg: #f4f4f1; --card: #fff; --ink: #1d1d1b; --mute: #6b6b66; --line: #e2e1dc; --link: #1a5fd0;
  --you: #c2261b; --you-bg: #fdecea; --others: #9a6200; --others-bg: #fdf3e1; --factory: #3d6b8f; --factory-bg: #eef3f7; --done: #8a8a84;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #161615; --card: #22221f; --ink: #ecebe6; --mute: #9b9a94; --line: #34332f; --link: #7fb0ff;
  --you: #ff8a7e; --you-bg: #3a1d1a; --others: #e9b65c; --others-bg: #33291a; --factory: #8fb6d6; --factory-bg: #1c262e; --done: #77766f;
} }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
a { color: var(--link); }
header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 14px; }
h1 { font-size: 18px; margin: 0; } h2 { font-size: 15px; margin: 0; } .mute { color: var(--mute); font-size: 12px; }

/* Waiting on you: one number, then where the questions come from. */
.you { background: var(--you-bg); border: 2px solid var(--you); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
.you .big { font-size: 34px; font-weight: 800; color: var(--you); line-height: 1; margin-right: 10px; }
.you .head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; }
.groups { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.group { background: var(--card); border: 1px solid var(--you); border-radius: 8px; padding: 6px 10px; }
.group b { color: var(--you); margin-right: 6px; } .group .ids { font-size: 12px; color: var(--mute); }

/* Each tier is a band; cards wrap across it. Loud for you, quiet for the factory. */
.tier { border-radius: 10px; padding: 10px 12px 12px; margin-bottom: 14px; }
.tier > .h { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.tier.you-t { background: var(--you-bg); } .tier.you-t h2 { color: var(--you); }
.tier.others-t { background: var(--others-bg); } .tier.others-t h2 { color: var(--others); }
.tier.factory-t { background: var(--factory-bg); } .tier.factory-t h2 { color: var(--factory); }
.tier.done-t h2 { color: var(--done); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 270px; max-width: 100%; }
.you-t .card { border-left-color: var(--you); } .others-t .card { border-left-color: var(--others); }
.factory-t .card { border-left-color: var(--factory); opacity: .85; font-size: 13px; width: 230px; }
.done-t .card { opacity: .6; font-size: 12px; width: 210px; }
.card .t { font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .w { font-size: 12px; margin-top: 2px; } .you-t .card .w { color: var(--you); font-weight: 600; }
.tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin-right: 4px; background: var(--bg); color: var(--mute); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; color: var(--you); border: 1px solid var(--you); border-radius: 4px; padding: 0 4px; margin-right: 4px; }
.lane { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.lane > .lh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; } .lane > .lh b { color: var(--factory); }
.lane .row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; } .lane .row + .row { margin-top: 6px; }
.lane .row > .k { font-size: 11px; color: var(--mute); width: 70px; padding-top: 8px; text-transform: uppercase; letter-spacing: .04em; }
.card.now { border-left-color: var(--factory); opacity: 1; box-shadow: 0 0 0 1px var(--factory) inset; }
.pos { display: inline-block; min-width: 22px; text-align: center; font-size: 11px; font-weight: 700; border-radius: 10px; background: var(--factory); color: var(--card); margin-right: 4px; }
.run { font-size: 12px; color: var(--factory); font-weight: 600; }
.seats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; } .seat { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
details summary { cursor: pointer; }
/* Review threads Alex resolves with one click: their own panel, never in the questions count. */
.threads { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 18px; }
.threads .pr { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
.threads .prh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.thread { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 6px 0; }
.thread .ask { font-weight: 600; overflow-wrap: anywhere; } .thread .res { font-size: 12px; color: var(--mute); overflow-wrap: anywhere; }
.thread .fail { font-size: 12px; color: var(--you); }
button { font: inherit; font-size: 12px; border: 1px solid var(--link); color: var(--link); background: var(--card); border-radius: 5px; padding: 2px 9px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><h1>Software Factory</h1><span class="mute" id="meta">loading…</span></header>
<section class="you" id="you" hidden>
  <div class="head"><span class="big" id="youCount"></span><h2>waiting on you</h2><span class="mute" style="margin-left:10px">Ask local-head "what's waiting on me" to answer them.</span></div>
  <div class="groups" id="youGroups"></div>
</section>
<section class="threads" id="threads" hidden><div class="prh"><h2>Review threads to resolve</h2><span class="mute">Resolve marks the thread resolved on GitHub directly; no agent runs.</span></div><div id="threadList"></div></section>
<main id="board"></main>
<div class="seats" id="seats"></div>
<script>
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
// Who a card is waiting on decides how loud it is. Agents (seats, triage, reviewer panes) are the factory.
const AGENT = /^(sup|sbx): |^triage$|^trusted-review|^questions router$|^board lead$|^local-head$|^factory$/;
const tierOf = c => ['history', 'parked'].includes(c.category) ? 'done'
  : c.needs?.me || c.waiting?.who === 'you' ? 'you'
  : c.waiting?.who && !AGENT.test(c.waiting.who) ? 'others' : 'factory';
// Cards folded into a PR's card show only when they need Alex; otherwise the PR's card speaks for them.
const shown = (c, order) => order.includes(c.category) || tierOf(c) === 'you';
const TIERS = [['you', 'Needs you'], ['others', 'Waiting on other people'], ['factory', 'The factory has it'], ['done', 'Done, closed or parked']];

function cardEl(c, labels) {
  const d = el('div', 'card');
  const t = el('div', 't', `${c.id} · ${c.title}`); t.title = c.title;
  if (c.priority) t.prepend(el('span', 'badge', 'Priority'));
  if (c.queue?.position) t.prepend(el('span', 'pos', `#${c.queue.position}`));
  d.append(t);
  if (c.running) { d.classList.add('now'); d.append(el('div', 'run', `▶ ${c.running.id} ${c.running.kind}${c.running.owner ? ` · ${c.running.owner}` : ''}`)); }
  const meta = el('div', 'mute');
  meta.append(el('span', 'tag', labels[c.category] || (c.category === 'in-unit' ? 'Part of a PR' : c.category)));
  if (c.stream) meta.append(el('span', null, c.stream.replace(/^sup: /, '') + ' '));
  if (/^https:\/\/github\.com\//.test(c.pr || '')) { const a = el('a', null, `#${c.pr.split('/pull/')[1]}`); a.href = c.pr; a.target = '_blank'; a.rel = 'noopener'; meta.append(a); }
  d.append(meta);
  if (c.waiting) d.append(el('div', 'w', c.waiting.text));
  return d;
}

// Inside the factory: each stream's running job and what's next on it, then the shared queue, then the rest.
function factoryLanes(cards, labels, b) {
  const box = el('div'), left = new Set(cards);
  const lane = (title, sub, rows) => {
    rows = rows.filter(([, cs]) => cs.length);
    if (!rows.length) return;
    const l = el('div', 'lane'), h = el('div', 'lh'); h.append(el('b', null, title), el('span', 'mute', sub)); l.append(h);
    for (const [k, cs] of rows) { const r = el('div', 'row'); r.append(el('span', 'k', k), ...cs.map(c => { left.delete(c); return cardEl(c, labels); })); l.append(r); }
    box.append(l);
  };
  const streams = [...new Set(cards.map(c => c.stream).filter(s => /^sup: /.test(s || '')))].sort();
  for (const s of streams) {
    const mine = cards.filter(c => c.stream === s && c.kind !== 'factory' && !c.queue?.position);
    const now = mine.filter(c => c.running), next = mine.filter(c => !c.running && !c.queue);
    const disk = b.disk?.[s] != null ? ` · disk ${Math.round(b.disk[s] * 100)}%` : '';
    lane(s.replace(/^sup: /, ''), (b.drain?.[s] ? `⚠ ${b.drain[s]} · ` : '') + (now.length ? `working on ${now.map(c => c.id).join(', ')}` : 'nothing running') + disk, [['Now', now], ['Next here', next]]);
  }
  const queue = cards.filter(c => c.queue?.position).sort((a, b) => a.queue.position - b.queue.position);
  lane('Queue', 'the next free stream takes #1', [['Waiting', queue]]);
  lane('Board developer', 'fixes to the factory itself', [['Fixes', cards.filter(c => c.kind === 'factory')]]);
  lane('Not in the queue', 'held for a reason on the card', [['Held', [...left]]]);
  return box;
}

async function render() {
  let b; try { b = await (await fetch('/api/board')).json(); } catch { document.getElementById('meta').textContent = 'factory unreachable; retrying'; return; }
  document.getElementById('meta').textContent = `${b.mode} · log seq ${b.seq} · ${new Date().toLocaleTimeString()}`;
  const byId = new Map(b.cards.map(c => [c.id, c]));

  // Questions grouped by the record's project; records don't carry one yet, so they land in one group.
  const groups = new Map();
  for (const q of b.questions) {
    const c = byId.get(q.work), key = q.project || c?.project || 'Not on a project yet';
    groups.set(key, [...(groups.get(key) || []), q.id]);
  }
  const extra = b.cards.filter(c => tierOf(c) === 'you' && !b.questions.some(q => q.work === c.id));
  if (extra.length) groups.set('Cards without a question', extra.map(c => c.id));
  const total = b.questions.length + extra.length;
  document.getElementById('youCount').textContent = total;
  const g = document.getElementById('youGroups'); g.replaceChildren();
  for (const [name, ids] of [...groups].sort((x, y) => y[1].length - x[1].length)) {
    const box = el('div', 'group'); box.append(el('b', null, ids.length), el('span', null, name + ' '), el('span', 'ids', ids.join(', ')));
    g.append(box);
  }
  document.getElementById('you').hidden = !total;

  threadsPanel(b.threads || []);
  const board = document.getElementById('board'); board.replaceChildren();
  const order = b.buckets.order;
  for (const [tier, name] of TIERS) {
    const cards = b.cards.filter(c => shown(c, order) && tierOf(c) === tier)
      .sort((x, y) => y.priority - x.priority || order.indexOf(x.category) - order.indexOf(y.category) || (y.updatedAt || '').localeCompare(x.updatedAt || ''));
    if (!cards.length) continue;
    const sec = el('section', `tier ${tier}-t`), h = el('div', 'h');
    h.append(el('h2', null, name), el('span', 'mute', String(cards.length)));
    sec.append(h);
    if (tier === 'factory') { sec.append(factoryLanes(cards, b.buckets.labels, b)); board.append(sec); continue; }
    const tiles = el('div', 'tiles'); tiles.append(...cards.map(c => cardEl(c, b.buckets.labels)));
    if (tier === 'done') { const det = el('details'); det.open = tier === 'factory'; det.append(el('summary', 'mute', tier === 'done' ? 'show' : 'hide / show'), tiles); sec.append(det); }
    else sec.append(tiles);
    board.append(sec);
  }
  const seats = document.getElementById('seats'); seats.replaceChildren();
  for (const [seat, n] of Object.entries(b.inbox)) seats.append(el('span', 'seat', `${seat}: ${n} unread`));
}
async function resolveThreads(ids, btn) {
  btn.disabled = true;
  try { await fetch('/api/threads/resolve', { method: 'POST', headers: { 'content-type': 'application/json', 'x-factory': '1' }, body: JSON.stringify({ ids }) }); }
  finally { render(); }
}
function threadsPanel(list) {
  const box = document.getElementById('threadList'); box.replaceChildren();
  const byPr = new Map(); for (const t of list) byPr.set(t.pr, [...(byPr.get(t.pr) || []), t]);
  for (const [pr, ts] of byPr) {
    const sec = el('div', 'pr'), h = el('div', 'prh'), a = el('a', null, `#${pr.split('/pull/')[1]}`);
    a.href = pr; a.target = '_blank'; a.rel = 'noopener';
    h.append(a, el('span', 'mute', `${ts[0].work} · ${ts[0].title || ''}`));
    const open = ts.filter(t => t.status !== 'approved');
    if (open.length > 1) { const all = el('button', null, `Resolve all ${open.length}`); all.onclick = () => resolveThreads(open.map(t => t.id), all); h.append(all); }
    sec.append(h);
    for (const t of ts) {
      const row = el('div', 'thread'), left = el('div'), link = el('a', null, `${t.id} · ${t.reviewer}`);
      link.href = t.url; link.target = '_blank'; link.rel = 'noopener';
      left.append(link, el('div', 'ask', t.ask), el('div', 'res', `Resolution: ${t.resolution}`));
      if (t.status === 'failed') left.append(el('div', 'fail', `Failed: ${t.detail}`));
      const b = el('button', null, t.status === 'approved' ? 'Resolving…' : t.status === 'failed' ? 'Retry' : 'Resolve');
      b.disabled = t.status === 'approved'; b.onclick = () => resolveThreads([t.id], b);
      row.append(left, b); sec.append(row);
    }
    box.append(sec);
  }
  document.getElementById('threads').hidden = !list.length;
}
render(); setInterval(render, 15000);
</script>
</body>
</html>

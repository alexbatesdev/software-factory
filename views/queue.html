<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Queue</title>
<style>
:root {
  --bg: #f4f4f1; --card: #fff; --ink: #1d1d1b; --mute: #6b6b66; --line: #e2e1dc; --link: #1a5fd0;
  --go: #2e7d32; --go-bg: #e8f5e9; --wait: #9a6200; --wait-bg: #fdf3e1; --work: #3d6b8f; --work-bg: #eef3f7; --gold: #c9930a;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161615; --card: #22221f; --ink: #ecebe6; --mute: #9b9a94; --line: #34332f; --link: #7fb0ff;
  --go: #81c784; --go-bg: #1b2e1c; --wait: #e9b65c; --wait-bg: #33291a; --work: #8fb6d6; --work-bg: #1c262e; --gold: #f2c94c;
} }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
a { color: var(--link); }
header { display: flex; gap: 12px; align-items: baseline; margin-bottom: 14px; }
h1 { font-size: 18px; margin: 0; } h2 { font-size: 15px; margin: 0 0 8px; } .mute { color: var(--mute); font-size: 12px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.streams { display: flex; gap: 10px; }
.stream { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stream b { display: block; } .free { color: var(--go); font-weight: 600; } .busy { color: var(--work); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td { padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; }
td.pos { width: 34px; font-weight: 700; color: var(--mute); } td.job { width: 150px; } td.id { width: 70px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 10px; padding: 1px 8px; }
.go { color: var(--go); background: var(--go-bg); } .wait { color: var(--wait); background: var(--wait-bg); }
.stag { font-size: 11px; font-weight: 700; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
</style>
</head>
<body>
<header><h1>Factory queue</h1><span class="mute" id="meta">loading…</span><a href="/" class="mute">Board</a> <a href="/projects" class="mute">Projects</a></header>
<section><h2>Streams</h2><div class="streams" id="streams"></div></section>
<section><h2>Queue</h2><div class="mute">One queue for every stream (W-505): support first, then priority, then age. A free stream that can take a job gets the next one.</div><table id="queue"></table></section>
<section><h2>Held</h2><div class="mute">Not waiting for a stream: each waits on what its line says.</div><table id="held"></table></section>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const row = q => `<tr><td class="pos">${q.pos ?? ''}</td><td class="id">${esc(q.id)}</td><td>${esc(q.title)}${q.support ? '<span class="stag">support</span>' : ''}${q.priority === 1 ? '<span class="stag">priority</span>' : ''}</td>
  <td class="job">${esc(q.job)}</td><td>${q.next ? `<span class="pill go">${esc(q.next)}</span>` : `<span class="pill wait">waiting</span> <span class="mute">${esc(q.reason)}</span>`}</td></tr>`;
async function render() {
  let d; try { d = await (await fetch('/api/queue')).json(); } catch { document.getElementById('meta').textContent = 'factory unreachable; retrying'; return; }
  document.getElementById('meta').textContent = `${d.queue.length} queued, ${d.held.length} held · refreshes every 15 s`;
  document.getElementById('streams').innerHTML = d.streams.map(s => `<div class="stream"><b>${esc(s.label)}</b>${s.busyWith ? `<span class="busy">${esc(s.busyWith)}</span> <span class="mute">${esc(s.title || '')}</span>` : '<span class="free">free</span>'}</div>`).join('');
  document.getElementById('queue').innerHTML = d.queue.map(row).join('') || '<tr><td class="mute">Nothing waiting for a stream.</td></tr>';
  document.getElementById('held').innerHTML = d.held.map(row).join('') || '<tr><td class="mute">Nothing held.</td></tr>';
}
render(); setInterval(render, 15000);
</script>
</body>
</html>
